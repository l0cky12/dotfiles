# ----------------------------------------------------------
# kitty — structure only.
#
# Colours, the full ANSI palette, tab colours and background_opacity all come
# from the desktop theme system: `theme set <slug>` regenerates
# theme/current-theme.conf, which is included at the bottom of this file and so
# overrides anything above it. Change the palette by editing
# ~/.config/hypr/themes/<slug>/colors.toml, not here.
# ----------------------------------------------------------

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Layout / spacing
window_padding_width 14

# Latency: kitty's documented low-latency set. The defaults (input_delay 3,
# repaint_delay 10, sync_to_monitor yes) add up to ~13 ms plus a vsync wait
# before a keystroke is drawn; Hyprland already presents frames tear-free.
input_delay 0
repaint_delay 2
sync_to_monitor no

# Blur support depends on platform/compositor support.
# Lower this if performance or text clarity suffers.
# background_opacity is theme-driven; see the include below.
background_blur 18

# Tab bar shape. The tab *colours* are themed; this is the geometry.
tab_bar_style           powerline
tab_powerline_style     slanted

# Remote control. `theme set` uses this to recolour running windows in place
# (one socket per instance), and scripts/files-here.sh uses it to find the
# active tab's working directory.
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# ── Theme ────────────────────────────────────────────────────────────────────
# Must stay last: kitty applies includes in order, so this is what wins.
include ./theme/current-theme.conf
