# Example GnuPG agent configuration.
#
# Copy this file into ~/.gnupg/gpg-agent.conf; see README.md.

# Expose an OpenSSH-compatible agent socket through gpg-agent.
enable-ssh-support

# Five minutes avoids repeated prompts during a short SSH operation while
# sharply limiting unattended reuse; the 15-minute ceiling still applies when
# repeated use resets the default timer. Add `KEYGRIP 0 confirm` to sshcontrol
# for per-use approval; see README.md.
default-cache-ttl-ssh 300
max-cache-ttl-ssh 900

# Five minutes covers a short signing/decryption task without making approval
# effectively session-long. Repeated use may reset that timer, but never beyond
# this 30-minute ceiling.
default-cache-ttl 300
max-cache-ttl 1800
