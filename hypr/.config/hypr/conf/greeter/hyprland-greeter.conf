# ~/.config/hypr/conf/greeter/hyprland-greeter.conf
#
# A throwaway Hyprland instance whose only job is to host the regreet greeter
# for one login, then exit. It is launched by system/greetd/config.toml as the
# `greeter` system user (not by any user session, and not by hyprland.lua) --
# it has no keybinds, no decorations, no autostart beyond regreet itself, and
# never reloads.
#
# Classic Hyprlang syntax, not this repo's Lua config: ReGreet's own README
# documents `command = "... start-hyprland -- -c /path/to/hyprland/config"` in
# this exact form, and this file is fully decoupled from the interactive
# session's hyprland.lua anyway. See greeter/README.md for the permission
# setup the `greeter` system user needs to read this path.

monitor = ,preferred,auto,1

# Documented ReGreet fix for a multi-second startup delay caused by portal
# negotiation in a compositor instance with no portal backend running.
env = GTK_USE_PORTAL,0
env = GDK_DEBUG,no-portals

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
}

exec-once = regreet; hyprctl dispatch exit
