# ~/.config/hypr/windowrules.conf
# Hyprland window rules
# Keep this file focused on window behavior only.

############################
# Generic floating behavior
############################

windowrule {
    name = float-modal
    match:modal = true

    float = on
    center = on
}

windowrule {
    name = round-floating
    match:float = true

    rounding = 10
    border_size = 2
}

windowrule {
    name = dim-floating
    match:float = true

    dim_around = on
}

windowrule {
    name = localsend
    match:class = ^org\.localsend\.localsend_app$

    float = on
    center = on
}

windowrule {
    name = capture-webcam-overlay
    match:title = ^capture-webcam$

    float = on
    pin = on
}

############################
# Fullscreen polish
############################

windowrule {
    name = fullscreen-border
    match:fullscreen = true

    border_color = rgb(89B4FA) rgb(CBA6F7)
}

############################
# Optional app-specific examples
# Uncomment and edit these later
############################

# Put Firefox on workspace 2
# windowrule = workspace 2, match:class firefox

# Float and center file picker windows
# windowrule = float on, center on, match:title .*Open File.*

# Give one app extra rounding
# windowrule = match:class kitty, rounding 12
# kitty opens on the active workspace; startup instance is pinned to ws1 via autostart.conf
windowrule = match:class ^(obsidian|Obsidian)$, workspace 3 silent
windowrule = match:class ^(virt-manager)$, workspace 6 silent
windowrule = match:class ^(org.kde.neochat)$, workspace 7 silent
windowrule = match:class ^(Spotify|spotify)$, workspace 9 silent
windowrule = match:class ^([Bb]rave-browser|helium|firefox)$, workspace 2 silent
windowrule = match:class ^t3code$, workspace 4 silent

# Legacy equivalent of the active Lua rule above.
windowrulev2 = fullscreen,class:^(io\.github\.fhlkfds\.screensaver)$
windowrulev2 = float,class:^(io\.github\.fhlkfds\.screensaver)$
windowrulev2 = animation slide,class:^(io\.github\.fhlkfds\.screensaver)$
