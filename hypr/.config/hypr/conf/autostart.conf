# Restore the last wallpaper selected through either active picker. The helper
# starts bare hyprpaper when state is absent/stale, preserving the old fallback.
exec-once = $HOME/.local/bin/hypr-wallpaper-picker restore
# Clipboard history watchers. Still exactly two persistent processes; only the
# handler changed, to filter secrets and excluded apps before storing.
exec-once = wl-paste --type text --watch $HOME/.config/hypr/scripts/clipboard-store.sh
exec-once = wl-paste --type image --watch $HOME/.config/hypr/scripts/clipboard-store.sh
#exec-once = swaync
#exec-once = qs -c noctalia-shell
exec-once = quickshell
# Launched by path: quickshell ignores config subdirectories once
# ~/.config/quickshell/shell.qml exists, so -c cannot name this one.
exec-once = quickshell -p $HOME/.config/quickshell/cava-visualizer
exec-once = $HOME/.config/hypr/scripts/hypridle-profile daemon
# Session-only mode expiry and backend reconciliation. It never owns locking,
# display power, suspend, or idle inhibition.
exec-once = $HOME/.local/bin/desktop-mode daemon
exec-once = ~/.config/hypr/scripts/spotify-notify.sh
exec-once = systemctl --user start hypr-monitor-watch.service
# Polkit needs an agent to ask for passwords, for example when fprintd enrolls a
# finger or NetworkManager saves a profile. hyprpolkitagent.service only starts
# with graphical-session.target, which a start-hyprland session never reaches,
# so without this those requests fail with "Not Authorized".
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = [workspace 2 silent] helium-browser
exec-once = [workspace 9 silent] spotify
exec-once = [workspace 6 silent] virt-manager
exec-once = [workspace 6 silent] hermes
exec-once = [workspace 3 silent] obsidian
exec-once = [workspace 4 silent] t3code
exec-once = [workspace 1 silent] kitty zsh -c 'herdr; exec zsh'

# Removable media: automount on insert + notify. No tray -- the Quickshell bar
# has no system tray; devices are managed from Nautilus's sidebar.
exec-once = udiskie --automount --notify --no-tray
