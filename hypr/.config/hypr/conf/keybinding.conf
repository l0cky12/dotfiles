$mainMod = SUPER

# Hyrpland
bindd = $mainMod, Return, terminal, exec, kitty
bindd = $mainMod SHIFT, Return, drop-down terminal, exec, $scriptsDir/Dropterminal.sh kitty
bindd = $mainMod, Q, close window, killactive,
bindd = , CTRL ALT, Delete, close all windows, exec, $scriptsDir/close-all-windows.sh
bindd = $mainMod, L, lock screen, exec, if test -x "$HOME/.local/bin/screensaver-lock"; then "$HOME/.local/bin/screensaver-lock"; else pidof hyprlock || hyprlock --config "$HOME/.config/hypr/hyprlock.conf"; fi
# Power menu
bindd = $mainMod, P, power menu, exec, bash $scriptsDir/power-menu.sh
# Helper scripts
bindd = $mainMod ALT, E, emoji menu, exec, $scriptsDir/RofiEmoji.sh 
# Searchable keybindings palette. Reads `hyprctl binds` at open time, so it
# always reflects this file.
bindd = $mainMod, K, keybindings, exec, quickshell ipc call keybinds toggle
# Standalone launcher from the `ai` Stow package. The launcher preserves its
# working directory and selects the default from ~/.config/ai-agent/config.
bindd = $mainMod, I, coding agent, exec, $HOME/.local/bin/ai-agent
# --- Universal clipboard (application-aware; see scripts/universal-clipboard.sh)
# Ctrl+C is deliberately NOT bound: terminals receive Ctrl+Shift+C instead,
# so shell interrupts keep working.
bindd = $mainMod, C, universal copy, exec, $scriptsDir/universal-clipboard.sh copy
bindd = $mainMod, X, universal cut, exec, $scriptsDir/universal-clipboard.sh cut
bindd = $mainMod, V, universal paste, exec, $scriptsDir/universal-clipboard.sh paste
bindd = $mainMod CTRL, V, clipboard history, exec, quickshell ipc call clipboard toggle
bindd = $mainMod ALT, V, toggle audio visualizer, exec, quickshell ipc call visualizer toggle
bindd = $mainMod SHIFT, C, calculator, exec, $scriptsDir/calculator.sh
bindd = $mainMod CTRL, Q, calculator, exec, $scriptsDir/calculator.sh
bindd = $mainMod CTRL, period, transcode media, exec, $scriptsDir/transcode-menu.sh
bindd = $mainMod CTRL, S, share with LocalSend, exec, localsend
bindd = $mainMod CTRL, T, activity (btop, floating), exec, $scriptsDir/btop-float.sh
bindd = $mainMod CTRL SHIFT, G, play temporary dotfiles history, exec, $scriptsDir/gource-dotfiles.sh
bindd = $mainMod ALT, T, network speed test, exec, quickshell ipc call network speedTest
bindd = $mainMod CTRL, I, toggle network panel, exec, quickshell ipc call network toggle
bindd = $mainMod CTRL, D, toggle display panel, exec, quickshell ipc call display toggle
bindd = $mainMod CTRL, M, toggle media panel, exec, quickshell ipc call media toggle
bindd = $mainMod CTRL, A, toggle audio panel, exec, quickshell ipc call audio toggle
bindd = $mainMod CTRL, B, toggle Bluetooth panel, exec, quickshell ipc call bluetooth toggle
bindd = $mainMod SHIFT, B, power profile menu, exec, $scriptsDir/power-profile.sh menu
bindd = $mainMod CTRL, W, manage Wi-Fi and network, exec, quickshell ipc call network manage
# Fullscreen cover-flow theme picker. Type to filter, arrows to browse, and it
# applies only on Enter or a click on the centre card -- browsing costs nothing.
# Also available from the Display panel; both entry points drive `theme set`.
bindd = $mainMod CTRL SHIFT, SPACE, theme picker, exec, quickshell ipc call theme toggle
bindd = $mainMod, Backspace, toggle window transparency on all workspaces, exec, $scriptsDir/toggle-transparency.sh
bindd = $mainMod SHIFT, Backspace, toggle window gaps on all workspaces, exec, $scriptsDir/toggle-gaps.sh
# --- Toggles
# Night light warms the screen to 1000K and back to 6500K; hyprsunset runs from
# autostart.conf with an identity profile, so it does nothing until asked.
bindd = $mainMod CTRL, N, night light, exec, $scriptsDir/night-light.sh toggle
# Native Quickshell notifications. The helper is a stable IPC facade; all
# lifecycle and persistence logic stays in the notification service.
bindd = $mainMod, comma, dismiss newest notification, exec, $HOME/.local/bin/notificationctl dismiss-one
bindd = $mainMod SHIFT, comma, dismiss all notifications, exec, $HOME/.local/bin/notificationctl dismiss-all
bindd = $mainMod CTRL, comma, toggle do not disturb, exec, $HOME/.local/bin/desktop-mode toggle do-not-disturb
bindd = $mainMod ALT, comma, invoke newest notification, exec, $HOME/.local/bin/notificationctl invoke-latest
bindd = $mainMod SHIFT ALT, comma, notification history, exec, $HOME/.local/bin/notificationctl history
# SUPER+D is unused; routed through the notificationctl wrapper like the
# neighbouring binds (it maps dnd-toggle to the Quickshell notifications IPC).
bindd = $mainMod, D, toggle do not disturb, exec, $HOME/.local/bin/notificationctl dnd-toggle
# Unified modes panel and direct actions. Stay-awake gates the idle lock;
# DPMS/suspend and the fixed screensaver listener stay independent.
bindd = $mainMod ALT, M, desktop modes, exec, $HOME/.local/bin/desktop-mode menu
bindd = $mainMod SHIFT, I, stay awake, exec, $HOME/.local/bin/desktop-mode toggle stay-awake
# --- Reminders (countdown timers; see menu/.local/bin/lmenu-reminder)
bindd = $mainMod CTRL, R, set a reminder, exec, $HOME/.local/bin/lmenu-reminder set
bindd = $mainMod CTRL ALT, R, show reminders, exec, $HOME/.local/bin/lmenu-reminder list
bindd = $mainMod CTRL SHIFT, R, clear all reminders, exec, $HOME/.local/bin/lmenu-reminder clear
bindd = $mainMod CTRL, O, toggle menu (night light, DND, stay awake, etc), exec, $scriptsDir/toggles-menu.sh
# The screensaver owns its own manual launch and does not require desktop-mode.
bindd = $mainMod CTRL, Escape, start ASCII screensaver, exec, $scriptsDir/run-if-deployed.sh screensaver ascii-screensaver force
bindd = $mainMod CTRL SHIFT, Escape, toggle automatic ASCII screensaver, exec, $scriptsDir/run-if-deployed.sh screensaver toggle-screensaver
bindd = $mainMod SHIFT, G, start Gaming VM, exec, bash -lc 'virsh -c qemu:///system start Gaming-VM && sleep 15 && looking-glass-client -F -f /dev/shm/looking-glass'

# --- Capture (see scripts/capture/) ------------------------------------------
# All on ordinary letter keys, so this works on any keyboard. The mnemonic is
# SUPER SHIFT + the first letter: S(hot), R(ecord), P(ick), T(ext).
#
# Smart mode freezes the screen, then a drag grabs a region while a plain click
# grabs the window under the pointer -- so it covers the old "region" bind too.
bindd = $mainMod SHIFT, S, screenshot, exec, $scriptsDir/capture/capture.sh screenshot smart
bindd = $mainMod ALT, S, screenshot focused monitor, exec, $scriptsDir/capture/capture.sh screenshot monitor
bindd = $mainMod ALT CTRL, S, screenshot monitor in 5s, exec, $scriptsDir/capture/capture.sh screenshot monitor --delay=5
bindd = $mainMod CTRL SHIFT, S, screenshot monitor in 10s, exec, $scriptsDir/capture/capture.sh screenshot monitor --delay=10
bindd = $mainMod SHIFT, R, screen recording, exec, $scriptsDir/capture/capture.sh record toggle
bindd = $mainMod SHIFT, P, colour picker, exec, $scriptsDir/capture/capture.sh color
bindd = $mainMod SHIFT, T, extract text, exec, $scriptsDir/capture/capture.sh ocr
bindd = $mainMod CTRL, C, capture menu, exec, $scriptsDir/capture/capture.sh menu
bindd = $mainMod ALT, C, toggle webcam overlay, exec, $scriptsDir/capture/capture.sh record webcam-toggle
bindd = $mainMod ALT, bracketleft, webcam overlay smaller, exec, $scriptsDir/capture/capture.sh record webcam-size smaller
bindd = $mainMod ALT, bracketright, webcam overlay larger, exec, $scriptsDir/capture/capture.sh record webcam-size larger

# Move active window to workspace and follow it.
bindd = $mainMod SHIFT, code:10, move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, code:11, move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, code:12, move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, code:13, move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, code:14, move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, code:15, move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, code:16, move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, code:17, move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, code:18, move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, code:19, move to workspace 10, movetoworkspace, 10
bindd = $mainMod SHIFT, bracketleft, move to previous workspace, movetoworkspace, -1
bindd = $mainMod SHIFT, bracketright, move to next workspace, movetoworkspace, +1

# Alternate silent moves for the first four workspaces. Keep the existing
# Super+Ctrl+number family below for workspaces 1-10.
bindd = $mainMod SHIFT ALT, code:10, move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod SHIFT ALT, code:11, move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod SHIFT ALT, code:12, move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod SHIFT ALT, code:13, move silently to workspace 4, movetoworkspacesilent, 4

# Move active window to workspace silently
bindd = $mainMod CTRL, code:10, move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod CTRL, code:11, move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod CTRL, code:12, move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod CTRL, code:13, move silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod CTRL, code:14, move silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod CTRL, code:15, move silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod CTRL, code:16, move silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod CTRL, code:17, move silently to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod CTRL, code:18, move silently to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod CTRL, code:19, move silently to workspace 10, movetoworkspacesilent, 10
bindd = $mainMod CTRL, bracketleft, move silently to previous workspace, movetoworkspacesilent, -1
bindd = $mainMod CTRL, bracketright, move silently to next workspace, movetoworkspacesilent, +1

# Fullscreen active window
# Mode 0 = true fullscreen (covers entire screen, hides gaps and the bar)
# Mode 1 = maximize (keeps gaps and bar visible) — previous behaviour
bindd = SUPER SHIFT, F, fullscreen (true), fullscreen, 0
bindd = SUPER CTRL,  F, maximize (keep bar), fullscreen, 1

## Programs
# --- Files (see scripts/files-here.sh)
# Super+E / Super+Shift+E open Files plainly; Super+Shift+Alt+F opens Files at
# the current working directory of the focused terminal.
bindd = $mainMod, E, files, exec, $FileManager
bindd = $mainMod SHIFT, E, files, exec, $FileManager
bindd = $mainMod SHIFT ALT, F, files here (terminal cwd), exec, $scriptsDir/files-here.sh
bindd = $mainMod SHIFT, D, disks, exec, $Disks
bindd = $mainMod, U, eject removable drives, exec, $scriptsDir/eject-drive.sh
bindd = $mainMod, A, application launcher, exec, $scriptsDir/quick-search.sh drun
bindd = $mainMod SHIFT, A, lmenu root, exec, $HOME/.local/bin/lmenu toggle
bindd = $mainMod ALT, A, web app manager, exec, quickshell ipc call webapps toggle
# Web app manager: install a website as a launcher, or remove one. Sits beside
# the app menu because that is where the results show up.
bindd = $mainMod, W, browser, exec, helium-browser
bindd = $mainMod ALT, W, Windows VM, exec, $HOME/.local/bin/windows-vm launch
bindd = $mainMod CTRL ALT, W, stop Windows VM, exec, $HOME/.local/bin/windows-vm stop
bindd = $mainMod SHIFT ALT, W, default browser private window, exec, $scriptsDir/default-browser-private
bindd = $mainMod, S, spotify, exec, spotify
bindd = $mainMod, O, obsidian, exec, obsidian
bindd = $mainMod, R, voice dictation, exec, hyprvoice toggle

bindd = $mainMod, T, toggle window floating / tiling, togglefloating,

bindd = $mainMod SHIFT, H, hermes, exec, hermes
bindd = $mainMod SHIFT, W, wallpaper picker, exec, ~/.local/bin/hypr-wallpaper-picker

## Workspaces
bindd = $mainMod, Tab, next workspace, workspace, e+1
bindd = $mainMod SHIFT, Tab, previous workspace, workspace, e-1
bindd = $mainMod CTRL, Tab, former workspace, workspace, previous
bindd = $mainMod, mouse_up, previous workspace, workspace, e-1
bindd = $mainMod, mouse_down, next workspace, workspace, e+1
bindd = $mainMod, 1, workspace 1, workspace, 1
bindd = $mainMod, 2, workspace 2, workspace, 2
bindd = $mainMod, 3, workspace 3, workspace, 3
bindd = $mainMod, 4, workspace 4, workspace, 4
bindd = $mainMod, 5, workspace 5, workspace, 5
bindd = $mainMod, 6, workspace 6, workspace, 6
bindd = $mainMod, 7, workspace 7, workspace, 7
bindd = $mainMod, 8, workspace 8, workspace, 8
bindd = $mainMod, 9, workspace 9, workspace, 9
bindd = $mainMod, code:19, workspace 10, workspace, 10
bindd = $mainMod ALT, 1, workspace 11, workspace, 11
bindd = $mainMod ALT, 2, workspace 12, workspace, 12
bindd = $mainMod ALT, 3, workspace 13, workspace, 13
bindd = $mainMod ALT, 4, workspace 14, workspace, 14
bindd = $mainMod ALT, 5, workspace 15, workspace, 15






# Extra
# Desktop zoom / magnifier
bindd = $mainMod ALT, mouse_down, Zoom in, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bindd = $mainMod ALT, mouse_up, Zoom out, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')

# Reset zoom
bindd = $mainMod ALT SHIFT, mouse_down, Reset zoom, exec, hyprctl -q keyword cursor:zoom_factor 1
bindd = $mainMod ALT SHIFT, mouse_up, Reset zoom, exec, hyprctl -q keyword cursor:zoom_factor 1


# Volume
# NOTE: the wpctl lines below shadow the pactl ones on the same keys -- Hyprland
# honours whichever is registered first. Kept as-is; only descriptions added.
binded = , XF86AudioRaiseVolume, volume up, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binded = , XF86AudioLowerVolume, volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindd  = , XF86AudioMute,        mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = , XF86AudioRaiseVolume, volume up (pactl), exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindeld = , XF86AudioLowerVolume, volume down (pactl), exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindld  = , XF86AudioMute,        mute (pactl), exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Media playback
bindd  = , XF86AudioPlay,        play / pause, exec, playerctl play-pause
bindd  = , XF86AudioPause,       pause, exec, playerctl pause
bindd  = , XF86AudioNext,        next track, exec, playerctl next
bindd  = , XF86AudioPrev,        previous track, exec, playerctl previous
bindd  = , XF86AudioStop,        stop playback, exec, playerctl stop

# Screen brightness
binded = , XF86MonBrightnessUp,   brightness up, exec, brightnessctl set +5%
binded = , XF86MonBrightnessDown, brightness down, exec, brightnessctl set 5%-

# Laptop lid: the internal panel follows the lid. Locked (l) so it still
# fires while the screen is locked.
bindld = , switch:on:Lid Switch,  lid closed: disable internal display, exec, $scriptsDir/lid-switch.sh close
bindld = , switch:off:Lid Switch, lid opened: enable internal display, exec, $scriptsDir/lid-switch.sh open

# Resize windows. These repeat while held; Alt is the fine step and Ctrl is the
# coarse step. The signs follow Hyprland's resizeactive delta convention.
# Tiling direction for the next window to open. dwindle's `preselect` is a
# one-time override, so each press affects only the next window.
# Horizontal = the new window opens beside this one; vertical = below it.
bindd = $mainMod, J, split horizontally (next window opens to the right), layoutmsg, preselect r
bindd = $mainMod SHIFT, V, split vertically (next window opens below), layoutmsg, preselect d
binded = $mainMod, minus, expand window left, resizeactive, -100 0
binded = $mainMod, equal, shrink window left, resizeactive, 100 0
binded = $mainMod SHIFT, minus, shrink window up, resizeactive, 0 -100
binded = $mainMod SHIFT, equal, expand window down, resizeactive, 0 100
binded = $mainMod ALT, minus, expand window left (fine), resizeactive, -10 0
binded = $mainMod ALT, equal, shrink window left (fine), resizeactive, 10 0
binded = $mainMod CTRL, minus, expand window left (coarse), resizeactive, -300 0
binded = $mainMod CTRL, equal, shrink window left (coarse), resizeactive, 300 0

# Save one width for this login session and restore it without changing the
# active window's current height.
bindd = $mainMod ALT, Home, save window width, exec, $scriptsDir/window-width.sh save
bindd = $mainMod, Home, restore saved window width, exec, $scriptsDir/window-width.sh restore

# Move windows
bindd = $mainMod CTRL, left, move window left, movewindow, l
bindd = $mainMod CTRL, right, move window right, movewindow, r
bindd = $mainMod CTRL, up, move window up, movewindow, u
bindd = $mainMod CTRL, down, move window down, movewindow, d

# Swap windows
bindd = $mainMod SHIFT, left, swap window left, swapwindow, l
bindd = $mainMod SHIFT, right, swap window right, swapwindow, r
bindd = $mainMod SHIFT, up, swap window up, swapwindow, u
bindd = $mainMod SHIFT, down, swap window down, swapwindow, d

# Move the current workspace and all its windows to a directional monitor.
bindd = $mainMod SHIFT ALT, left, move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod SHIFT ALT, right, move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = $mainMod SHIFT ALT, up, move workspace to upper monitor, movecurrentworkspacetomonitor, u
bindd = $mainMod SHIFT ALT, down, move workspace to lower monitor, movecurrentworkspacetomonitor, d

# Move focus with mainMod + arrow keys
bindd = $mainMod, left, focus left, movefocus, l
bindd = $mainMod, right, focus right, movefocus, r
bindd = $mainMod, up, focus up, movefocus, u
bindd = $mainMod, down, focus down, movefocus, d
# Drag window with Win + Shift + Left Mouse
bindm = SUPER, mouse:272, movewindow

# Resize window with Win + Shift + Right Mouse
bindm = SUPER SHIFT, mouse:273, resizewindow
