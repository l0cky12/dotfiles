# {{ theme_name }} — kitty theme
# GENERATED from themes/{{ theme_slug }}/colors.toml — do not edit.
#
# kitty.conf includes this file last, so everything here wins. The ANSI block is
# the theme's authored terminal palette, not a brightened copy of the UI colours.

background              {{ background }}
foreground              {{ foreground }}
background_opacity      {{ surface_opacity }}

selection_background    {{ selection }}
selection_foreground    {{ fg_on(selection) }}

cursor                  {{ accent }}
cursor_text_color       {{ fg_on(accent) }}

url_color               {{ ansi.blue }}

active_border_color     {{ border_active }}
inactive_border_color   {{ border }}
bell_border_color       {{ urgent }}

# Tabs — kitty.conf uses the slanted powerline style, so these need to read
# against each other as well as against the bar.
tab_bar_background      {{ background_alt }}
active_tab_background   {{ surface_alt }}
active_tab_foreground   {{ foreground_bright }}
inactive_tab_background {{ surface }}
inactive_tab_foreground {{ muted }}
tab_bar_margin_color    {{ background_alt }}

# ── ANSI ─────────────────────────────────────────────────────────────────────
# normal
color0  {{ ansi.black }}
color1  {{ ansi.red }}
color2  {{ ansi.green }}
color3  {{ ansi.yellow }}
color4  {{ ansi.blue }}
color5  {{ ansi.magenta }}
color6  {{ ansi.cyan }}
color7  {{ ansi.white }}
# bright
color8  {{ ansi.bright_black }}
color9  {{ ansi.bright_red }}
color10 {{ ansi.bright_green }}
color11 {{ ansi.bright_yellow }}
color12 {{ ansi.bright_blue }}
color13 {{ ansi.bright_magenta }}
color14 {{ ansi.bright_cyan }}
color15 {{ ansi.bright_white }}
