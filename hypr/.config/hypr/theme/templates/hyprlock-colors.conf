# ~/.config/hyprlock/colors.conf
# GENERATED from themes/{{ theme_slug }}/colors.toml — do not edit.
# Theme: {{ theme_name }} ({{ theme_mode }})
#
# Variable names are kept exactly as the previous generator emitted them, so the
# existing hyprlock layouts keep working unchanged.

# Primary
$primary   = {{ hex_no_hash(background) }}
$text      = {{ hex_no_hash(foreground_bright) }}
$bg        = {{ hex_no_hash(background_alt) }}

# Accents
$accent_1  = {{ hex_no_hash(accent) }}
$accent_2  = {{ hex_no_hash(accent_alt) }}
$accent_3  = {{ hex_no_hash(cyan) }}
$accent_4  = {{ hex_no_hash(magenta) }}

# Surfaces
$surface_1 = {{ hex_no_hash(surface) }}
$surface_2 = {{ hex_no_hash(surface_alt) }}
$overlay_1 = {{ hex_no_hash(overlay) }}

# rgba variants
$primary_rgba   = {{ hypr_rgba(background, 0.9) }}
$text_rgba      = {{ hypr_rgba(foreground_bright, 0.9) }}
$accent_1_rgba  = {{ hypr_rgba(accent, 0.9) }}
$accent_2_rgba  = {{ hypr_rgba(accent_alt, 0.9) }}
$accent_3_rgba  = {{ hypr_rgba(cyan, 0.9) }}
$accent_4_rgba  = {{ hypr_rgba(magenta, 0.9) }}
$surface_1_rgba = {{ hypr_rgba(surface, 0.9) }}
$surface_2_rgba = {{ hypr_rgba(surface_alt, 0.9) }}

# Dimmed variants
$primary_dim   = {{ hypr_rgba(background, 0.5) }}
$accent_1_dim  = {{ hypr_rgba(accent, 0.5) }}
$accent_2_dim  = {{ hypr_rgba(accent_alt, 0.5) }}
